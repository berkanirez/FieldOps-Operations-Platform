name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # StockPilot's integration tests (Day 27-28) spin up their own
      # Testcontainers-managed SQL Server — GitHub's ubuntu-latest runners
      # already have Docker available, so no extra database setup is needed
      # here at all.
      - name: Restore StockPilot
        run: dotnet restore StockPilot.slnx

      - name: Build StockPilot
        run: dotnet build StockPilot.slnx --no-restore

      - name: Test StockPilot
        run: dotnet test StockPilot.slnx --no-build --logger trx --results-directory ./TestResults

      - name: Upload StockPilot test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockpilot-test-results
          path: ./TestResults

      - name: Restore RoadmapOS
        run: dotnet restore RoadmapOS.slnx

      - name: Build RoadmapOS
        run: dotnet build RoadmapOS.slnx --no-restore

      - name: Test RoadmapOS
        run: dotnet test RoadmapOS.slnx --no-build

      # FieldOps's integration tests (Day 48) spin up their own
      # Testcontainers-managed SQL Server for the Organizations module,
      # exactly like StockPilot's above — GitHub's ubuntu-latest runners
      # already have Docker available, so no extra database setup is needed
      # here either.
      - name: Restore FieldOps
        run: dotnet restore FieldOps.slnx

      - name: Build FieldOps
        run: dotnet build FieldOps.slnx --no-restore

      - name: Test FieldOps
        run: dotnet test FieldOps.slnx --no-build

      # Day 60: the Dockerfile (Day 58) and docker-compose.yml (Day 59) are
      # real, checked-in deliverables now — nothing above (dotnet build/test)
      # ever touches either of them, so a broken Dockerfile (e.g. someone
      # adds a new module and forgets its COPY lines) would otherwise go
      # completely unnoticed by CI. GitHub's ubuntu-latest runner already has
      # Docker available (the same fact StockPilot Day 28/FieldOps Day 48
      # already rely on for Testcontainers).
      - name: Build FieldOps.Api Docker image
        run: docker build -t fieldops-api:ci .

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      # A real secret (Day 59: the Linux SQL Server image only supports SQL
      # Authentication) is created fresh, only for this CI run, and never
      # committed — the same "environment variable, never a checked-in
      # file" mechanism Day 57/59 established, just generated by the
      # workflow itself here since there is no real secret store for this
      # personal project.
      - name: Create CI-only .env for Docker Compose
        run: echo "SA_PASSWORD=CI_Only_Temp_Pw1" > .env

      - name: Start Docker Compose stack
        run: docker compose up -d --build

      # SQL Server's container reports "started" well before the SQL Server
      # engine inside it actually accepts connections (Day 59's own
      # depends_on lesson) — retrying each migration a few times, rather
      # than assuming one attempt will succeed, absorbs that startup delay
      # without needing a separate readiness-polling step first.
      - name: Apply EF Core migrations to the containerized SQL Server
        run: |
          CONN_BASE="Server=localhost,14330;User Id=sa;Password=CI_Only_Temp_Pw1;TrustServerCertificate=True;"
          for pair in "FieldOps.Modules.Organizations:FieldOpsOrganizations" "FieldOps.Modules.Employees:FieldOpsEmployees" "FieldOps.Modules.WorkOrders:FieldOpsWorkOrders" "FieldOps.Modules.Customers:FieldOpsCustomers" "FieldOps.Modules.AuditLogs:FieldOpsAuditLogs"; do
            proj="${pair%%:*}"
            db="${pair##*:}"
            for attempt in $(seq 1 10); do
              if dotnet ef database update --project "src/$proj" --connection "${CONN_BASE}Database=${db};"; then
                break
              fi
              echo "Migration attempt $attempt for $db failed, retrying in 5s..."
              sleep 5
              if [ "$attempt" -eq 10 ]; then
                echo "Migration for $db did not succeed in time"
                exit 1
              fi
            done
          done

      - name: Verify the containerized stack is genuinely healthy
        run: |
          for attempt in $(seq 1 10); do
            RESPONSE=$(curl -s http://localhost:5190/health/ready || true)
            echo "$RESPONSE"
            if echo "$RESPONSE" | grep -q '"status":"Healthy"'; then
              exit 0
            fi
            sleep 5
          done
          echo "FieldOps.Api did not report Healthy in time"
          exit 1

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down

  # Day 104: the Angular frontend (Phase 5) had never been part of CI — its
  # unit tests only ever ran on a developer machine. Runs in parallel with
  # the backend job above.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/fieldops-web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/fieldops-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test fieldops-web
        run: npx ng test --watch=false

      - name: Build fieldops-web
        run: npm run build

  # Day 104: turns CI from "checks the code" into "delivers deployable
  # images." Runs only after BOTH test jobs pass, and only for pushes to
  # master — pull requests are tested but never published.
  publish-images:
    needs: [build-and-test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # The workflow's automatic GITHUB_TOKEN is read-only by default; pushing
    # to GitHub Container Registry needs packages: write. No stored secret
    # is involved — the token is issued per run and expires with it.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Each image gets two tags: the commit SHA (an exact, never-reused
      # record of which code it was built from — what a rollback will point
      # back to) and "latest" (a moving pointer to the newest build).
      # Registry names must be lowercase, hence the tr.
      # The org.opencontainers.image.source label links each package to this
      # repository on GitHub.
      - name: Build and push images
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG="${GITHUB_SHA::7}"
          SOURCE_LABEL="org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"

          API_IMAGE="ghcr.io/${OWNER}/fieldops-api"
          docker build --label "$SOURCE_LABEL" -t "${API_IMAGE}:${SHA_TAG}" -t "${API_IMAGE}:latest" .
          docker push "${API_IMAGE}:${SHA_TAG}"
          docker push "${API_IMAGE}:latest"

          WEB_IMAGE="ghcr.io/${OWNER}/fieldops-web"
          docker build --label "$SOURCE_LABEL" -t "${WEB_IMAGE}:${SHA_TAG}" -t "${WEB_IMAGE}:latest" src/fieldops-web
          docker push "${WEB_IMAGE}:${SHA_TAG}"
          docker push "${WEB_IMAGE}:latest"

          echo "Published ${API_IMAGE}:${SHA_TAG} and ${WEB_IMAGE}:${SHA_TAG}"
