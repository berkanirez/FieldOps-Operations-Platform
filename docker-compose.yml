# Day 59: all three pieces of FieldOps — SQL Server, Redis, and the API
# itself — defined together and put on one shared Docker network. Services
# on that network reach each other by service name (e.g. "sqlserver",
# "redis"), never "localhost" — this is exactly what removes Day 58's
# named-instance/UDP-discovery problem: no named instance, no discovery
# step, just a fixed container name and a fixed port.
#
# SA_PASSWORD comes from a local .env file (gitignored) — never written
# here directly. A Linux SQL Server container only supports SQL
# Authentication (no Windows Authentication), so this is a real secret,
# not a demo stand-in, injected the same way Day 57 proved: an environment
# variable, never a checked-in file.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "14330:1433"
    # Day 125: the container counts as "started" seconds before SQL Server
    # accepts logins, so migrations run right after `up` could fail with a
    # pre-login handshake error. This check runs a real query; `docker
    # compose up --wait` blocks until it passes. ($$ escapes Compose's own
    # interpolation: the variable is expanded inside the container.)
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - fieldops

  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"
    networks:
      - fieldops

  # Day 66: RabbitMQ — the message broker for Phase 4's move toward
  # asynchronous, decoupled communication. The "-management" image variant
  # bundles a web management UI (port 15672) purely so today's demonstration
  # can be observed visually, not just through logs. Same shared-network,
  # addressed-by-service-name pattern as sqlserver/redis above — no
  # discovery step, no named instance, just "rabbitmq" and a fixed port.
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - fieldops

  # Day 79: single-node, security-disabled Elasticsearch — a demo
  # simplification (a real cluster would have multiple nodes and real
  # authentication); "discovery.type=single-node" tells Elasticsearch not
  # to wait for other nodes that will never exist here.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - fieldops

  fieldops-api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - sqlserver
      - redis
      - rabbitmq
      - elasticsearch
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FieldOpsOrganizationsDb: "Server=sqlserver;Database=FieldOpsOrganizations;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      ConnectionStrings__FieldOpsEmployeesDb: "Server=sqlserver;Database=FieldOpsEmployees;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      ConnectionStrings__FieldOpsWorkOrdersDb: "Server=sqlserver;Database=FieldOpsWorkOrders;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      ConnectionStrings__FieldOpsCustomersDb: "Server=sqlserver;Database=FieldOpsCustomers;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      ConnectionStrings__FieldOpsAuditLogsDb: "Server=sqlserver;Database=FieldOpsAuditLogs;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      Redis__ConnectionString: "redis:6379"
      RabbitMq__HostName: "rabbitmq"
      Elasticsearch__Uri: "http://elasticsearch:9200"
    ports:
      - "5190:8080"
    networks:
      - fieldops

  # Day 76 / ADR 0005: the first real service extraction — a genuinely
  # separate deployable, with its own database (FieldOpsNotifications, still
  # on the same shared sqlserver container for this demo, but its own
  # catalog, never touched by fieldops-api). Its only real link to
  # fieldops-api is RabbitMq__HostName pointing at the same broker; there is
  # no shared connection string and no reference to fieldops-api's image.
  fieldops-notification-service:
    build:
      context: .
      dockerfile: src/FieldOps.NotificationService/Dockerfile
    depends_on:
      - sqlserver
      - rabbitmq
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__FieldOpsNotificationsDb: "Server=sqlserver;Database=FieldOpsNotifications;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      RabbitMq__HostName: "rabbitmq"
    networks:
      - fieldops

networks:
  fieldops:
