# Day 99: the first Kubernetes manifest in this repo. fieldops-web is the
# deliberate starting point — stateless, no database/Redis/RabbitMQ, no
# secrets — so today is purely about Kubernetes's own core concepts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fieldops-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fieldops-web
  template:
    metadata:
      labels:
        app: fieldops-web
    spec:
      containers:
        - name: fieldops-web
          image: fieldops-web:day105
          # A locally built image (the local cluster never pulls it from
          # anywhere). Since Day 104, CI also publishes this image to
          # ghcr.io/berkanirez/fieldops-web, which a cloud cluster would use.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          # Day 105: where nginx forwards /api/... — the API's Service name,
          # resolved by the cluster's own DNS. The image itself contains no
          # API address. Note: nginx resolves this name when it starts, so
          # the fieldops-api Service must exist before this Pod starts.
          env:
            - name: API_UPSTREAM
              value: "http://fieldops-api"
          # Day 103: the HorizontalPodAutoscaler computes "% CPU" relative to
          # this request — without it, CPU-based autoscaling can't work at all.
          # Deliberately tiny: nginx serving static files barely uses CPU, so
          # a small request makes a modest synthetic load visible as a high
          # percentage. A real value would be set from measured usage.
          resources:
            requests:
              cpu: 10m
          # Day 100: without probes, Kubernetes only knows whether the
          # container PROCESS exists — not whether nginx actually answers.
          # Both probes hit "/" over HTTP. Note: because of Day 98's
          # try_files fallback, ANY path returns 200 here, so a probe's path
          # can't detect much — what it really proves is "nginx is up and
          # answering HTTP on this port."
          readinessProbe:
            # Failing = "don't send me traffic right now": the Pod is
            # removed from the Service's endpoints, but NOT restarted.
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            # Failing = "I'm broken": Kubernetes restarts the container.
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
